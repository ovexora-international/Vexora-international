<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Faucet - Login</title>
    <!-- FontAwesome & Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: #0a0e1a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #131b2e; width: 100%; max-width: 400px; padding: 30px; border-radius: 16px; border: 1px solid #1e293b; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card h2 { margin-bottom: 8px; color: #38bdf8; font-size: 26px; }
        .card p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .google-btn { width: 100%; background: #ffffff; color: #000; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s ease; }
        .google-btn:hover { background: #e2e8f0; transform: translateY(-2px); }
        .google-btn i { color: #ea4335; font-size: 18px; }
        .status-msg { margin-top: 15px; font-size: 13px; color: #f87171; }
    </style>
</head>
<body>

<div class="card">
    <h2>Power Faucet</h2>
    <p>Sign in with your Gmail account to start earning LTC & USDT.</p>

    <button class="google-btn" onclick="googleLogin()">
        <i class="fa-brands fa-google"></i> Continue with Google
    </button>

    <div id="status" class="status-msg"></div>
</div>

<script>
    // 1. Apne Firebase Project ki Configuration yahan daalein
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Firebase Initialize karein
    firebase.initializeApp(firebaseConfig);

    // Google Login Function
    function googleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        document.getElementById('status').innerText = "Connecting to Google...";

        firebase.auth().signInWithPopup(provider)
        .then((result) => {
            const user = result.user;
            
            // LocalStorage mein User Info save karein
            localStorage.setItem("userEmail", user.email);
            localStorage.setItem("userName", user.displayName);
            localStorage.setItem("userPhoto", user.photoURL);

            // Google Apps Script ko login alert bhejein
            registerUserToSheet(user.email);
        })
        .catch((error) => {
            document.getElementById('status').innerText = "Login Failed: " + error.message;
        });
    }

    // Google Apps Script (Backend) ko call karke user register karna
    function registerUserToSheet(email) {
        const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL"; // Apps Script URL daalein

        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "login", email: email })
        })
        .then(res => res.json())
        .then(data => {
            // Dashboard par redirect karein
            window.location.href = "dashboard.html";
        })
        .catch(err => {
            // Agar API na bhi chale toh direct Dashboard bhej dein
            window.location.href = "dashboard.html";
        });
    }

    // Pehle se login user ko direct dashboard par bhejna
    window.onload = function() {
        if(localStorage.getItem("userEmail")) {
            window.location.href = "dashboard.html";
        }
    }
</script>

</body>
</html>
