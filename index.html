<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexora International - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <!-- FingerprintJS for 1 Device 1 Account Policy -->
    <script src="https://openfpcdn.io/fingerprintjs/v3"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: #070a12; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: #0f172a; width: 100%; max-width: 420px; padding: 35px 25px; border-radius: 20px; border: 1px solid #1e293b; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .brand-logo { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .tagline { color: #64748b; font-size: 13px; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }
        .google-btn { width: 100%; background: #ffffff; color: #0f172a; border: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: 0.3s; }
        .google-btn:hover { background: #f1f5f9; transform: translateY(-2px); }
        .status-msg { margin-top: 18px; font-size: 13px; color: #ef4444; }
        .policy-tag { margin-top: 25px; font-size: 11px; color: #475569; display: flex; align-items: center; justify-content: center; gap: 6px; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand-logo">VEXORA</div>
    <div class="tagline">International Faucet</div>

    <button class="google-btn" onclick="googleLogin()">
        <i class="fa-brands fa-google" style="color: #ea4335; font-size: 18px;"></i> Continue with Gmail
    </button>

    <div id="status" class="status-msg"></div>

    <div class="policy-tag">
        <i class="fa-solid fa-shield-halved"></i> Strictly 1 Account per Device Allowed
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL"; // Yahan Apps Script Web App URL dalein

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);

    let deviceId = "";

    // Device Fingerprint generate karna (1 Device Policy ke liye)
    FingerprintJS.load().then(fp => fp.get()).then(result => {
        deviceId = result.visitorId;
    });

    function googleLogin() {
        if(!deviceId) {
            document.getElementById('status').innerText = "Securing device connection, try again...";
            return;
        }

        const provider = new firebase.auth.GoogleAuthProvider();
        document.getElementById('status').style.color = "#38bdf8";
        document.getElementById('status').innerText = "Connecting to Google...";

        firebase.auth().signInWithPopup(provider).then((result) => {
            const user = result.user;
            document.getElementById('status').innerText = "Verifying Device Policy...";

            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "login",
                    email: user.email,
                    deviceId: deviceId
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "error") {
                    document.getElementById('status').style.color = "#ef4444";
                    document.getElementById('status').innerText = data.message;
                } else {
                    localStorage.setItem("userEmail", user.email);
                    localStorage.setItem("userName", user.displayName);
                    localStorage.setItem("userPhoto", user.photoURL);
                    window.location.href = "dashboard.html";
                }
            })
            .catch(err => {
                document.getElementById('status').innerText = "Server Connection Error!";
            });
        }).catch(error => {
            document.getElementById('status').innerText = error.message;
        });
    }

    window.onload = function() {
        if(localStorage.getItem("userEmail")) {
            window.location.href = "dashboard.html";
        }
    }
</script>

</body>
</html>
