<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexora International - Dashboard</title>
    <!-- Outfit Font & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        body { background: #070a12; color: #fff; min-height: 100vh; padding-bottom: 40px; }
        
        /* Navbar Header */
        .navbar { background: #0f172a; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 100; }
        .logo-title { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 0.5px; }
        .user-nav { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #38bdf8; object-fit: cover; }
        .logout-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .logout-btn:hover { background: #ef4444; color: #fff; }

        /* Container */
        .container { max-width: 500px; margin: 25px auto; padding: 0 16px; }

        /* Main Balance Card */
        .balance-card { background: linear-gradient(135deg, #1e1b4b, #0f172a); border: 1px solid #312e81; padding: 28px 20px; border-radius: 24px; text-align: center; margin-bottom: 25px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .balance-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%); pointer-events: none; }
        .balance-title { font-size: 13px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        .balance-amount { font-size: 42px; font-weight: 800; color: #38bdf8; margin: 10px 0 5px 0; letter-spacing: 1px; }
        .badge-verified { display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.2); }

        /* Links Navigation Grid */
        .section-heading { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        
        .menu-card { background: #0f172a; border: 1px solid #1e293b; padding: 20px 15px; border-radius: 18px; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: all 0.3s ease; position: relative; }
        .menu-card:hover { border-color: #38bdf8; transform: translateY(-4px); box-shadow: 0 8px 20px rgba(56, 189, 248, 0.15); background: #131d33; }
        
        .icon-box { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 22px; }
        
        /* Distinct Icon Background Colors */
        .ic-faucet { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .ic-ptc { background: rgba(129, 140, 248, 0.15); color: #818cf8; }
        .ic-links { background: rgba(251, 146, 60, 0.15); color: #fb923c; }
        .ic-walls { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }
        .ic-coupon { background: rgba(250, 204, 21, 0.15); color: #facc15; }
        .ic-withdraw { background: rgba(52, 211, 153, 0.15); color: #34d399; }

        .menu-card h4 { font-size: 15px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
        .menu-card p { font-size: 11px; color: #64748b; }
        
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>

<!-- Top Navigation Bar -->
<div class="navbar">
    <div class="logo-title">VEXORA INT.</div>
    <div class="user-nav">
        <img id="u-img" src="" class="user-avatar" alt="Profile">
        <button class="logout-btn" onclick="logout()" title="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </div>
</div>

<div class="container">
    <!-- Top Balance Card -->
    <div class="balance-card">
        <div class="balance-title">Total Earned Balance</div>
        <div class="balance-amount">$<span id="bal-display">0.0000</span></div>
        <div class="badge-verified">
            <i class="fa-solid fa-circle-check"></i> Account Active
        </div>
    </div>

    <!-- Page Links Grid -->
    <div class="section-heading">
        <i class="fa-solid fa-grid-2" style="color:#38bdf8;"></i> Earn & Withdraw
    </div>

    <div class="menu-grid">
        <!-- 1. Faucet Page -->
        <a href="faucet.html" class="menu-card">
            <div class="icon-box ic-faucet">
                <i class="fa-solid fa-faucet-drip"></i>
            </div>
            <h4>Faucet</h4>
            <p>Claim Free Coins</p>
        </a>

        <!-- 2. PTC Ads Page -->
        <a href="ptc.html" class="menu-card">
            <div class="icon-box ic-ptc">
                <i class="fa-solid fa-hand-pointer"></i>
            </div>
            <h4>PTC Ads</h4>
            <p>Watch & Earn</p>
        </a>

        <!-- 3. Shortlinks Page -->
        <a href="shortlinks.html" class="menu-card">
            <div class="icon-box ic-links">
                <i class="fa-solid fa-link"></i>
            </div>
            <h4>Shortlinks</h4>
            <p>Complete Links</p>
        </a>

        <!-- 4. Offerwalls Page -->
        <a href="offerwalls.html" class="menu-card">
            <div class="icon-box ic-walls">
                <i class="fa-solid fa-layer-group"></i>
            </div>
            <h4>Offerwalls</h4>
            <p>Tasks & Surveys</p>
        </a>

        <!-- 5. Coupon Page -->
        <a href="coupon.html" class="menu-card">
            <div class="icon-box ic-coupon">
                <i class="fa-solid fa-ticket"></i>
            </div>
            <h4>Coupons</h4>
            <p>Redeem Promo Code</p>
        </a>

        <!-- 6. Withdraw Page -->
        <a href="withdraw.html" class="menu-card">
            <div class="icon-box ic-withdraw">
                <i class="fa-solid fa-wallet"></i>
            </div>
            <h4>Withdraw</h4>
            <p>LTC & USDT Instant</p>
        </a>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL"; // Web App URL yahan daalein
    const userEmail = localStorage.getItem("userEmail");

    window.onload = function() {
        // Verification Check
        if(!userEmail) {
            window.location.href = "login.html";
            return;
        }

        // Profile Photo Set
        document.getElementById("u-img").src = localStorage.getItem("userPhoto") || "https://via.placeholder.com/38";
        
        // Fetch Live Balance from Google Apps Script
        fetchBalance();
    }

    function fetchBalance() {
        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "login", email: userEmail })
        })
        .then(res => res.json())
        .then(data => {
            if(data.balance !== undefined) {
                document.getElementById("bal-display").innerText = parseFloat(data.balance).toFixed(4);
            }
        })
        .catch(err => {
            console.log("Balance fetch error:", err);
        });
    }

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }
</script>

</body>
</html>
