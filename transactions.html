<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions — Vexora International</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

  <!-- SLIDE-OUT DRAWER MENU -->
  <div class="menu-overlay" id="menu-overlay" onclick="toggleMenu()"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-close" onclick="toggleMenu()">✕</div>
    <div class="logo">Vexora <span>Intl.</span></div>
    <div class="tagline">Earning Platform</div>

    <a class="nav-item" href="dashboard.html"><span class="icon">🏠</span><span class="label">Dashboard</span></a>
    <a class="nav-item" href="advertising.html"><span class="icon">📢</span><span class="label">Advertising Board</span></a>

    <div class="nav-group-label">Earn Money</div>
    <a class="nav-item" href="earn-ptc.html"><span class="icon">🎬</span><span class="label">PTC Ads</span></a>
    <a class="nav-item" href="earn-faucet.html"><span class="icon">💧</span><span class="label">Faucet</span></a>
    <a class="nav-item" href="earn-shortlinks.html"><span class="icon">🔗</span><span class="label">Shortlinks</span></a>
    <a class="nav-item" href="earn-offerwalls.html"><span class="icon">🎁</span><span class="label">Offerwalls</span></a>

    <div class="nav-group-label">Account</div>
    <a class="nav-item" href="withdraw.html"><span class="icon">💳</span><span class="label">Withdraw</span></a>
    <a class="nav-item active" href="transactions.html"><span class="icon">📄</span><span class="label">Transactions</span></a>

    <div class="drawer-footer">
      <a class="nav-item" href="#" onclick="clearSession(); window.location.href='index.html';">
        <span class="icon">🚪</span><span class="label">Logout</span>
      </a>
    </div>
  </aside>

  <!-- TOP NAV -->
  <div class="top-nav">
    <div class="top-nav-left">
      <button class="hamburger-btn" onclick="toggleMenu()">☰</button>
      <div class="logo">Vexora <span>Intl.</span></div>
    </div>
    <div class="balance-pill">
      <div>
        <div class="label">Balance</div>
        <div class="amount" id="balance-amount">0 Token</div>
      </div>
    </div>
  </div>

  <div class="main-content">
      <div class="card">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Method</th><th>Status</th><th>Reference</th></tr></thead>
          <tbody id="txn-table"><tr><td colspan="6" style="color:var(--text-dim);">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>

</div>

<script src="config.js"></script>
<script>
  const user = requireLogin();

  if (user) {
    apiGet('getUser', { email: user.email }).then(res => {
      if (res.success) document.getElementById('balance-amount').innerText = formatTokens(res.user.Balance || 0);
    });

    apiGet('getTransactions', { userId: user.userId }).then(res => {
      const tbody = document.getElementById('txn-table');
      if (res.success && res.transactions.length) {
        const sorted = res.transactions.sort((a, b) => new Date(b.Timestamp) - new Date(a.Timestamp));
        tbody.innerHTML = sorted.map(t => `
          <tr>
            <td>${new Date(t.Timestamp).toLocaleString()}</td>
            <td>${t.Type}</td>
            <td style="color:${Number(t.Amount) >= 0 ? 'var(--success)' : 'var(--danger)'}">${formatTokens(t.Amount)}</td>
            <td>${t.Method}</td>
            <td><span class="status-pill status-${String(t.Status).toLowerCase()}">${t.Status}</span></td>
            <td style="color:var(--text-dim); font-size:0.8rem;">${t.Reference || '—'}</td>
          </tr>
        `).join('');
      } else {
        tbody.innerHTML = '<tr><td colspan="6" style="color:var(--text-dim);">Koi transaction nahi mili.</td></tr>';
      }
    });
  }
</script>

</body>
</html>
